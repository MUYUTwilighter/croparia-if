import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'com.gradleup.shadow'
    id "com.modrinth.minotaur" version "2.+"
    id 'net.darkhax.curseforgegradle' version '1.1.26'
}

archives_name = "$archives_name-$minecraft_version"

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
    implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:$mixin_extras_version"))

    // JToml
    implementation(include "io.github.wasabithumb:jtoml:$jtoml_version")
    implementation(include "io.github.wasabithumb:jtoml-api:$jtoml_version")
    implementation(include "io.github.wasabithumb:jtoml-internals:$jtoml_version")
    implementation(include "io.github.wasabithumb:jtoml-serializer-gson:$jtoml_version")

    modImplementation "net.fabricmc:fabric-loader:$fabric_loader_version"
    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$fabric_api_version"
    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-fabric:$architectury_api_version"

    // REI
    modLocalRuntime "me.shedaniel:RoughlyEnoughItems-fabric:$rei_version"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:$rei_version"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:$rei_version"
    // JEI
    compileOnly("mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}")
    modLocalRuntime("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")
    // No kubeJs on this branch for now

    // TSS
//    modCompileOnly("flat:toms_storage_fabric-1.21.4:2.3.2")

    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "net.fabricmc:fabric-loader-junit:${fabric_loader_version}"
    testImplementation(project(path: ':common', configuration: 'namedElements')) { transitive false }
    testRuntimeOnly project(path: ':common', configuration: 'namedElements')
    testRuntimeOnly project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    injectAccessWidener = true
    inputFile.set shadowJar.archiveFile
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

base {
    archivesName = "$archives_name-fabric"
}

modrinth {
    token = System.getenv("MODRINTH_MOD_PUBLISH")
    projectId = "croparia-if"
    versionName = "$archives_name-fabric-$mod_version"
    versionNumber = mod_version
    versionType = "$release_state"
    uploadFile = remapJar
    gameVersions = [minecraft_version]
    loaders = ["fabric"]
    File changelogFile = rootProject.file("changelog.md")
    if (changelogFile.exists()) {
        changelog = changelogFile.text
    }
    dependencies {
        required.project "architectury-api"
        required.project "fabric-api"
        incompatible.project "croparia"
    }
}

tasks.register('curseforge', TaskPublishCurseForge) {
    apiToken = System.getenv("CURSEFORGE_MOD_PUBLISH")
    group = 'publishing'
    def mainFile = upload('971004', remapJar)
    mainFile.displayName = "$archives_name-fabric-$mod_version"
    mainFile.releaseType = "$release_state"
    File changelogFile = rootProject.file("changelog.md")
    if (changelogFile.exists()) {
        mainFile.changelog = changelogFile.text
    }
    mainFile.changelogType = 'markdown'
    mainFile.gameVersions = [minecraft_version]
    mainFile.addJavaVersion("Java 17")
    mainFile.addEnvironment("server", "client")
    mainFile.addModLoader("fabric")
    mainFile.addRequirement("architectury-api")
    mainFile.addRequirement("fabric-api")
    mainFile.addIncompatibility("croparia")
}
