registry = "croparia:melons"
path = "botanypots/recipes/${id.namespace}/melon/${id.path}.json"
dependencies = "botanypots"
template = """
{
  "type": "botanypots:crop",
  "seed": {
    "item": "${seed}"
  },
  "categories": [
    "crop", "farmland"
  ],
  "growthTicks": 1200,
  "display": {
    "type": "botanypots:aging",
    "block": "${crop_block}"
  },
  "drops": [
    {
        "chance": 1.00,
        "output": {
            "item": {melon._qis}
        }
    },
    {
        "chance": 0.01,
        "output": {
            "item": {seed._qis}
        }
    }
  ]
}
"""