template = """
{
  "type": "croparia:ritual",
  "ritual": "#croparia:ritual_stands",
  "ingredient": ${croparia._qis},
  "block": ${material.name._qis},
  "result": {
    "id": "croparia:melon_seed",
    "components": {
      "croparia:crop": "${id}"
    }
  }
}
"""